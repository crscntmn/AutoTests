name: Docker Selenium CI

on:
  push:
    branches:
      - develop

  workflow_dispatch:

jobs:
  docker-tests:
    runs-on: ubuntu-latest

    env:
      PASSWORD: ${{ secrets.PASSWORD }}
      SHORT_PASSWORD: ${{ secrets.SHORT_PASSWORD }}
      INVALIDATE_PASSWORD: ${{ secrets.INVALIDATE_PASSWORD }}
      WRONG_PASSWORD: ${{ secrets.WRONG_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build autotests image
        run: docker compose build autotests

      - name: Start Selenium
        run: docker compose up -d chrome

      - name: Check Selenium
        run: |
          docker compose ps
          curl --fail http://localhost:4444/status

      - name: Run tests
        run: docker compose up autotests

      - name: Show Docker containers
        if: always()
        run: docker compose ps -a

      - name: Show test reports
        if: always()
        run: |
          echo "===== SUREFIRE REPORTS ====="
          docker cp autotests:/app/target ./target || true

          if [ -d "./target/surefire-reports" ]; then
            find ./target/surefire-reports -maxdepth 1 -type f -print
          else
            echo "Surefire reports were not found"
          fi