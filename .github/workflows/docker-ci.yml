name: Docker Selenium CI

on:
  workflow_call:
    inputs:
      suite:
        description: Test suite
        required: true
        type: string

permissions:
  contents: read

jobs:

  docker-tests:

    name: Docker Selenium (${{ matrix.browser }})

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          - browser: chrome
            selenium_image: selenium/standalone-chrome:latest

          - browser: firefox
            selenium_image: selenium/standalone-firefox:latest

          - browser: edge
            selenium_image: selenium/standalone-edge:latest


    env:
      PASSWORD: ${{ secrets.PASSWORD }}
      SHORT_PASSWORD: ${{ secrets.SHORT_PASSWORD }}
      INVALIDATE_PASSWORD: ${{ secrets.INVALIDATE_PASSWORD }}
      WRONG_PASSWORD: ${{ secrets.WRONG_PASSWORD }}

      BROWSER: ${{ matrix.browser }}
      SELENIUM_IMAGE: ${{ matrix.selenium_image }}

      TEST_GROUP: ${{ inputs.suite == 'all' && '' || inputs.suite }}


    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show configuration
        run: |
          echo "Browser: $BROWSER"
          echo "Selenium image: $SELENIUM_IMAGE"
          echo "Test group: $TEST_GROUP"

      - name: Build autotests image
        run: docker compose build autotests

      - name: Start Selenium
        run: docker compose up -d selenium

      - name: Check Selenium
        run: |
          echo "Waiting for Selenium..."

          for i in {1..30}; do

            if curl -sf http://localhost:4444/status > /dev/null; then
              echo "Selenium is ready!"

              curl -s http://localhost:4444/status

              exit 0
            fi

            echo "Selenium is not ready yet... attempt $i/30"

            sleep 2

          done

          echo "Selenium did not become ready"

          docker compose ps
          docker compose logs selenium

          exit 1

      - name: Run tests
        id: run-tests
        continue-on-error: true
        run: docker compose up autotests

      - name: Show Docker containers
        if: always()
        run: docker compose ps -a

      - name: Collect test reports
        if: always()
        run: |
          mkdir -p docker-results/surefire-reports
          mkdir -p docker-results/allure-results

          echo "===== SUREFIRE REPORTS ====="

          docker cp autotests:/app/target/surefire-reports/. \
            docker-results/surefire-reports/ || true

          find docker-results/surefire-reports \
            -type f 2>/dev/null || true


          echo "===== ALLURE RESULTS ====="

          docker cp autotests:/app/allure-results/. \
            docker-results/allure-results/ || true

          find docker-results/allure-results \
            -type f 2>/dev/null || true

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-surefire-${{ matrix.browser }}
          path: docker-results/surefire-reports/
          if-no-files-found: warn

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-results-${{ matrix.browser }}
          path: docker-results/allure-results/
          if-no-files-found: warn

      - name: Set up Java
        if: always()
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Allure CLI
        if: always()
        run: |
          curl -Lo allure.tgz \
            https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz

          tar -xzf allure.tgz

      - name: Generate Docker Allure report
        if: always()
        run: |
          if [ -d "docker-results/allure-results" ] && \
             [ "$(find docker-results/allure-results -type f | wc -l)" -gt 0 ]; then

            ./allure-2.34.1/bin/allure generate \
              docker-results/allure-results \
              --clean \
              -o docker-allure-report

            test -f docker-allure-report/index.html

          else

            echo "No Docker Allure results found."

            mkdir -p docker-allure-report

            cat > docker-allure-report/index.html <<'EOF'
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="UTF-8">
              <title>Docker Allure Report</title>
            </head>
            <body>
              <h1>No Allure results</h1>
              <p>No test results were produced for this browser.</p>
            </body>
            </html>
            EOF

          fi

      - name: Upload Docker Allure report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-allure-${{ matrix.browser }}
          path: docker-allure-report/
          if-no-files-found: error

      - name: Fail workflow if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1