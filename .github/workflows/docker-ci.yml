name: Docker Selenium CI

on:
  push:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-tests:
    runs-on: ubuntu-latest

    env:
      PASSWORD: ${{ secrets.PASSWORD }}
      SHORT_PASSWORD: ${{ secrets.SHORT_PASSWORD }}
      INVALIDATE_PASSWORD: ${{ secrets.INVALIDATE_PASSWORD }}
      WRONG_PASSWORD: ${{ secrets.WRONG_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build autotests image
        run: docker compose build autotests

      - name: Start Selenium
        run: docker compose up -d chrome

      - name: Check Selenium
        run: |
          echo "Waiting for Selenium..."

          for i in {1..30}; do
            if curl -sf http://localhost:4444/status > /dev/null; then
              echo "Selenium is ready!"
              curl -s http://localhost:4444/status
              exit 0
            fi

            echo "Selenium is not ready yet... attempt $i/30"
            sleep 2
          done

          echo "Selenium did not become ready"
          docker compose ps
          docker compose logs chrome
          exit 1

      - name: Run tests
        id: run-tests
        continue-on-error: true
        run: docker compose up autotests

      - name: Show Docker containers
        if: always()
        run: docker compose ps -a

      - name: Collect test reports
        if: always()
        run: |
          mkdir -p docker-results/surefire-reports
          mkdir -p docker-results/allure-results

          echo "===== COPYING SUREFIRE REPORTS ====="

          docker cp \
            autotests:/app/target/surefire-reports/. \
            docker-results/surefire-reports/ || true

          echo "===== COPYING ALLURE RESULTS ====="

          docker cp \
            autotests:/app/allure-results/. \
            docker-results/allure-results/ || true

          echo "===== SUREFIRE REPORTS ====="

          find docker-results/surefire-reports \
            -type f 2>/dev/null || true

          echo "===== ALLURE RESULTS ====="

          find docker-results/allure-results \
            -type f 2>/dev/null || true

      - name: Upload Docker test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-surefire-reports
          path: docker-results/surefire-reports/
          if-no-files-found: warn

      - name: Upload Docker Allure results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-allure-results
          path: docker-results/allure-results/
          if-no-files-found: error

      - name: Fail workflow if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1

  docker-allure-report:
    name: Generate Docker Allure Report
    runs-on: ubuntu-latest
    needs: docker-tests
    if: always()

    steps:
      - name: Download Docker Allure results
        uses: actions/download-artifact@v6
        with:
          name: docker-allure-results
          path: allure-results

      - name: Show Allure results
        run: |
          echo "===== DOCKER ALLURE RESULTS ====="

          find allure-results -type f

          echo "===== FILE COUNT ====="

          find allure-results -type f | wc -l

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Allure CLI
        run: |
          curl -Lo allure.tgz \
            https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz

          tar -xzf allure.tgz

      - name: Check Allure version
        run: |
          ./allure-2.34.1/bin/allure --version

      - name: Generate Docker Allure Report
        run: |
          ./allure-2.34.1/bin/allure generate \
            allure-results \
            --clean \
            -o docker-allure-report

      - name: Verify Docker Allure Report
        run: |
          echo "===== DOCKER ALLURE REPORT ====="

          find docker-allure-report \
            -maxdepth 2 \
            -type f | head -50

          test -f docker-allure-report/index.html

      - name: Upload Docker Allure Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-allure-report
          path: docker-allure-report/
          if-no-files-found: error