name: Docker Selenium CI

on:
  push:
    branches:
      - develop

  workflow_dispatch:

jobs:
  docker-tests:
    runs-on: ubuntu-latest

    env:
      PASSWORD: ${{ secrets.PASSWORD }}
      SHORT_PASSWORD: ${{ secrets.SHORT_PASSWORD }}
      INVALIDATE_PASSWORD: ${{ secrets.INVALIDATE_PASSWORD }}
      WRONG_PASSWORD: ${{ secrets.WRONG_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build autotests image
        run: docker compose build autotests

      - name: Start Selenium
        run: docker compose up -d chrome

      - name: Check Selenium
        run: |
          echo "Waiting for Selenium..."

          for i in {1..30}; do
            if curl -sf http://localhost:4444/status > /dev/null; then
              echo "Selenium is ready!"
              curl -s http://localhost:4444/status
              exit 0
            fi

            echo "Selenium is not ready yet... attempt $i/30"
            sleep 2
          done

          echo "Selenium did not become ready"
          docker compose ps
          docker compose logs chrome
          exit 1

      - name: Run tests
        run: docker compose up autotests

      - name: Show Docker containers
        if: always()
        run: docker compose ps -a

      - name: Collect test reports
        if: always()
        run: |
          mkdir -p docker-results

          docker cp autotests:/app/target/surefire-reports ./docker-results/surefire-reports || true
          docker cp autotests:/app/allure-results ./docker-results/allure-results || true

          echo "===== SUREFIRE REPORTS ====="
          find docker-results/surefire-reports -type f 2>/dev/null || true

          echo "===== ALLURE RESULTS ====="
          find docker-results/allure-results -type f 2>/dev/null || true

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-surefire-reports
          path: docker-results/surefire-reports/

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-allure-results
          path: docker-results/allure-results/