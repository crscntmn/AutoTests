name: Docker Selenium CI

on:
  workflow_call:
    outputs:
      run_id:
        description: Workflow run ID
        value: ${{ jobs.docker-tests.outputs.run_id }}

permissions:
  contents: read

jobs:

  docker-tests:

    name: Docker Selenium tests

    runs-on: ubuntu-latest

    outputs:
      run_id: ${{ github.run_id }}

    env:
      PASSWORD: ${{ secrets.PASSWORD }}
      SHORT_PASSWORD: ${{ secrets.SHORT_PASSWORD }}
      INVALIDATE_PASSWORD: ${{ secrets.INVALIDATE_PASSWORD }}
      WRONG_PASSWORD: ${{ secrets.WRONG_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show Docker environment
        run: |
          docker --version
          docker compose version

          echo "===== Docker Compose services ====="

          docker compose \
            -f docker-compose.yml \
            config --services

      - name: Build autotests image
        run: |
          docker compose \
            -f docker-compose.yml \
            build autotests

      - name: Start Selenium
        run: |
          docker compose \
            -f docker-compose.yml \
            up -d selenium

      - name: Show containers
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            ps -a

      - name: Check Selenium
        run: |
          echo "Waiting for Selenium..."

          for i in {1..30}; do
            if curl -sf http://localhost:4444/status > /dev/null; then
              echo "Selenium is ready!"
              curl -s http://localhost:4444/status
              exit 0
            fi

            echo "Selenium is not ready yet..."
            echo "Attempt $i/30"
            sleep 2
          done

          echo "Selenium did not become ready."

          docker compose \
            -f docker-compose.yml \
            ps -a

          echo "===== Selenium logs ====="

          docker compose \
            -f docker-compose.yml \
            logs selenium

          exit 1

      - name: Run tests
        id: run-tests
        continue-on-error: true
        run: |
          docker compose \
            -f docker-compose.yml \
            up autotests

      - name: Show Docker containers
        if: always()
        run: |
          echo "===== Docker containers ====="

          docker compose \
            -f docker-compose.yml \
            ps -a

          echo ""
          echo "===== Autotests logs ====="

          docker compose \
            -f docker-compose.yml \
            logs autotests || true

      - name: Collect test reports
        if: always()
        run: |

          mkdir -p docker-results/surefire-reports
          mkdir -p docker-results/allure-results

          echo "===== Copy Surefire reports ====="

          docker cp \
            autotests:/app/target/surefire-reports/. \
            docker-results/surefire-reports/ \
            || true

          echo "===== Copy Allure results ====="

          docker cp \
            autotests:/app/allure-results/. \
            docker-results/allure-results/ \
            || true

          echo ""
          echo "===== SUREFIRE REPORTS ====="

          find \
            docker-results/surefire-reports \
            -type f \
            2>/dev/null \
            || true

          echo ""
          echo "===== ALLURE RESULTS ====="

          find \
            docker-results/allure-results \
            -type f \
            2>/dev/null \
            || true

      - name: Upload Docker Surefire reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-surefire-reports
          path: docker-results/surefire-reports/
          if-no-files-found: warn

      - name: Upload Docker Allure results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-allure-results
          path: docker-results/allure-results/
          if-no-files-found: warn

      - name: Stop Selenium
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            down

      - name: Fail workflow if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: |
          echo "Docker tests failed."
          exit 1

  allure-report:

    name: Generate Docker Allure Report

    runs-on: ubuntu-latest

    needs:
      - docker-tests

    if: always()

    steps:
      - name: Download Docker Allure results
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          name: docker-allure-results
          path: allure-results

      - name: Show Allure results
        if: always()
        run: |
          echo "===== DOCKER ALLURE RESULTS ====="

          if [ -d "allure-results" ]; then
            find allure-results -type f | head -100 || true
          else
            echo "Allure results directory does not exist."
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Allure CLI
        run: |
          curl -Lo allure.tgz \
            https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz

          tar -xzf allure.tgz

      - name: Generate Docker Allure Report
        if: always()
        run: |
          rm -rf docker-allure-report
          mkdir -p docker-allure-report

          if [ -d "allure-results" ] && \
             [ "$(find allure-results -type f | wc -l)" -gt 0 ]; then

            echo "Generating Allure report..."

            ./allure-2.34.1/bin/allure generate \
              allure-results \
              --clean \
              -o docker-allure-report

            test -f docker-allure-report/index.html

            echo "Allure report generated successfully."

          else

            echo "No Allure results found."

            printf '%s\n' \
              '<!DOCTYPE html>' \
              '<html lang="en">' \
              '<head>' \
              '  <meta charset="UTF-8">' \
              '  <title>Docker Selenium Allure Report</title>' \
              '</head>' \
              '<body>' \
              '  <h1>No Allure results</h1>' \
              '  <p>No Allure test results were produced for this Docker run.</p>' \
              '</body>' \
              '</html>' \
              > docker-allure-report/index.html

          fi

      - name: Verify Docker Allure Report
        if: always()
        run: |
          echo "===== DOCKER ALLURE REPORT ====="

          find docker-allure-report \
            -maxdepth 2 \
            -type f \
            | head -100

          test -f docker-allure-report/index.html

      - name: Upload Docker Allure Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-allure-report
          path: docker-allure-report/
          if-no-files-found: error