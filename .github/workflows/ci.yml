name: Selenium CI

on:
  workflow_call:
    inputs:
      suite:
        description: Test suite
        required: true
        type: string

    outputs:
      run_id:
        description: Selenium CI workflow run ID
        value: ${{ github.run_id }}

permissions:
  contents: read

jobs:
  test:
    name: Selenium tests
    runs-on: ubuntu-latest

    env:
      PASSWORD: ${{ secrets.PASSWORD }}
      SHORT_PASSWORD: ${{ secrets.SHORT_PASSWORD }}
      INVALIDATE_PASSWORD: ${{ secrets.INVALIDATE_PASSWORD }}
      WRONG_PASSWORD: ${{ secrets.WRONG_PASSWORD }}

    strategy:
      matrix:
        java: [17, 21]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run all tests
        if: inputs.suite == 'all'
        run: mvn clean test

      - name: Run tagged tests
        if: inputs.suite == 'smoke' || inputs.suite == 'regression'
        run: mvn clean test -Dgroups=${{ inputs.suite }}

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports-java-${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-results-java-${{ matrix.java }}
          path: allure-results/
          if-no-files-found: error

  allure-report:
    name: Generate Selenium Allure Report
    runs-on: ubuntu-latest

    needs: test
    if: always() && needs.test.result != 'cancelled'

    steps:
      - name: Download Selenium Allure results
        uses: actions/download-artifact@v6
        with:
          pattern: allure-results-java-*
          path: allure-results
          merge-multiple: true

      - name: Show Allure results
        run: |
          echo "===== SELENIUM ALLURE RESULTS ====="
          find allure-results -type f
          echo ""
          echo "Files: $(find allure-results -type f | wc -l)"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Allure CLI
        run: |
          curl -Lo allure.tgz \
            https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz

          tar -xzf allure.tgz

      - name: Generate Selenium Allure Report
        run: |
          ./allure-2.34.1/bin/allure generate \
            allure-results \
            --clean \
            -o selenium-allure-report

      - name: Verify Selenium Allure Report
        run: |
          test -f selenium-allure-report/index.html

      - name: Upload Selenium Allure Report
        uses: actions/upload-artifact@v6
        with:
          name: selenium-allure-report
          path: selenium-allure-report/
          if-no-files-found: error