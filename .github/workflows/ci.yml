name: Selenium CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        required: true
        default: all
        type: choice
        options:
          - all
          - smoke
          - regression

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PASSWORD: ${{ secrets.PASSWORD }}
      SHORT_PASSWORD: ${{ secrets.SHORT_PASSWORD }}
      INVALIDATE_PASSWORD: ${{ secrets.INVALIDATE_PASSWORD }}
      WRONG_PASSWORD: ${{ secrets.WRONG_PASSWORD }}

    strategy:
      matrix:
        java: [17, 21]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run all tests
        if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.suite == 'all' || github.event_name == 'pull_request'
        run: mvn clean test

      - name: Run tagged tests
        if: inputs.suite == 'smoke' || inputs.suite == 'regression'
        run: mvn clean test -Dgroups=${{ inputs.suite }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java-${{ matrix.java }}
          path: target/surefire-reports/

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-java-${{ matrix.java }}
          path: allure-results/

  allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-java-*
          path: allure-results
          merge-multiple: true

      - name: Show downloaded files
        run: ls -R allure-results

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Allure CLI
        run: |
          curl -Lo allure.tgz https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz
          tar -xzf allure.tgz

      - name: Check Allure version
        run: ./allure-2.34.1/bin/allure --version

      - name: Generate Allure Report
        run: ./allure-2.34.1/bin/allure generate allure-results --clean -o allure-report

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4