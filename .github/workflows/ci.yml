name: Selenium CI

on:
  workflow_call:
    inputs:
      suite:
        description: Test suite
        required: true
        type: string

    outputs:
      run_id:
        description: Selenium CI workflow run ID
        value: ${{ github.run_id }}

permissions:
  contents: read

jobs:

  selenium-tests:

    name: ${{ matrix.os-name }} / Java ${{ matrix.java }} / ${{ matrix.browser }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            os-name: ubuntu
            java: 17
            browser: chrome

          - os: ubuntu-latest
            os-name: ubuntu
            java: 17
            browser: firefox

          - os: ubuntu-latest
            os-name: ubuntu
            java: 17
            browser: edge

          - os: ubuntu-latest
            os-name: ubuntu
            java: 21
            browser: chrome

          - os: ubuntu-latest
            os-name: ubuntu
            java: 21
            browser: firefox

          - os: ubuntu-latest
            os-name: ubuntu
            java: 21
            browser: edge

          - os: windows-latest
            os-name: windows
            java: 17
            browser: chrome

          - os: windows-latest
            os-name: windows
            java: 17
            browser: firefox

          - os: windows-latest
            os-name: windows
            java: 17
            browser: edge

          - os: windows-latest
            os-name: windows
            java: 21
            browser: chrome

          - os: windows-latest
            os-name: windows
            java: 21
            browser: firefox

          - os: windows-latest
            os-name: windows
            java: 21
            browser: edge

          - os: macos-latest
            os-name: macos
            java: 17
            browser: chrome

          - os: macos-latest
            os-name: macos
            java: 17
            browser: firefox

          - os: macos-latest
            os-name: macos
            java: 17
            browser: edge

          - os: macos-latest
            os-name: macos
            java: 21
            browser: chrome

          - os: macos-latest
            os-name: macos
            java: 21
            browser: firefox

          - os: macos-latest
            os-name: macos
            java: 21
            browser: edge


    env:
      PASSWORD: ${{ secrets.PASSWORD }}
      SHORT_PASSWORD: ${{ secrets.SHORT_PASSWORD }}
      INVALIDATE_PASSWORD: ${{ secrets.INVALIDATE_PASSWORD }}
      WRONG_PASSWORD: ${{ secrets.WRONG_PASSWORD }}

      BROWSER: ${{ matrix.browser }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Show environment
        shell: bash
        run: |
          echo "OS: ${{ matrix.os-name }}"
          echo "Java: ${{ matrix.java }}"
          echo "Browser: ${{ matrix.browser }}"

          java -version
          mvn -version

      - name: Run all tests
        if: inputs.suite == 'all'
        run: mvn clean test

      - name: Run tagged tests
        if: inputs.suite == 'smoke' || inputs.suite == 'regression'
        run: mvn clean test -Dgroups=${{ inputs.suite }}

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-${{ matrix.os-name }}-java-${{ matrix.java }}-${{ matrix.browser }}
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Install Allure CLI
        if: always()
        shell: bash
        run: |
          curl -Lo allure.tgz \
            https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz

          tar -xzf allure.tgz

      - name: Generate Allure report
        if: always()
        shell: bash
        run: |
          rm -rf allure-report

          if [ -d "allure-results" ] && [ "$(find allure-results -type f | wc -l)" -gt 0 ]; then

            ./allure-2.34.1/bin/allure generate \
              allure-results \
              --clean \
              -o allure-report

            test -f allure-report/index.html

          else

            mkdir -p allure-report

            printf '%s\n' \
              '<!DOCTYPE html>' \
              '<html lang="en">' \
              '<head>' \
              '<meta charset="UTF-8">' \
              '<title>Allure Report</title>' \
              '</head>' \
              '<body>' \
              '<h1>No Allure results</h1>' \
              '<p>No test results were produced for this configuration.</p>' \
              '</body>' \
              '</html>' \
              > allure-report/index.html

          fi

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: selenium-allure-${{ matrix.os-name }}-java-${{ matrix.java }}-${{ matrix.browser }}
          path: allure-report/
          if-no-files-found: error