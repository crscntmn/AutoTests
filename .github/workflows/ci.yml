name: Selenium CI

on:
  workflow_call:
    inputs:
      suite:
        description: Test suite
        required: true
        type: string

      os:
        description: Operating system
        required: true
        type: string

      os_name:
        description: Operating system display name
        required: true
        type: string

      java:
        description: Java version
        required: true
        type: string

      browser:
        description: Browser
        required: true
        type: string

      config_name:
        description: Full configuration name
        required: true
        type: string


    outputs:

      run_id:
        description: Selenium CI workflow run ID
        value: ${{ jobs.selenium-tests.outputs.run_id }}


permissions:
  contents: read


jobs:

  selenium-tests:
    name: ${{ inputs.config_name }}

    runs-on: ${{ inputs.os }}

    outputs:

      run_id: ${{ steps.workflow-run-id.outputs.run_id }}


    env:

      PASSWORD: ${{ secrets.PASSWORD }}
      SHORT_PASSWORD: ${{ secrets.SHORT_PASSWORD }}
      INVALIDATE_PASSWORD: ${{ secrets.INVALIDATE_PASSWORD }}
      WRONG_PASSWORD: ${{ secrets.WRONG_PASSWORD }}

      BROWSER: ${{ inputs.browser }}


    steps:
      - name: Get workflow run ID
        id: workflow-run-id
        shell: bash
        run: |
          echo "run_id=${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java }}
          cache: maven

      - name: Show environment
        shell: bash
        run: |
          echo "Configuration: ${{ inputs.config_name }}"
          echo "OS: ${{ inputs.os_name }}"
          echo "Java: ${{ inputs.java }}"
          echo "Browser: ${{ inputs.browser }}"

          java -version
          mvn -version

      - name: Run all tests
        if: inputs.suite == 'all'
        run: mvn clean test

      - name: Run tagged tests
        if: inputs.suite == 'smoke' || inputs.suite == 'regression'
        run: mvn clean test -Dgroups=${{ inputs.suite }}

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-${{ inputs.os_name }}-java-${{ inputs.java }}-${{ inputs.browser }}
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Install Allure CLI
        if: always()
        shell: bash
        run: |
          curl -Lo allure.tgz \
            https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz

          tar -xzf allure.tgz

      - name: Generate Allure report
        if: always()
        shell: bash
        run: |
          rm -rf allure-report

          if [ -d "allure-results" ] && [ "$(find allure-results -type f | wc -l)" -gt 0 ]; then

            ./allure-2.34.1/bin/allure generate \
              allure-results \
              --clean \
              -o allure-report

            test -f allure-report/index.html

          else

            mkdir -p allure-report

            printf '%s\n' \
              '<!DOCTYPE html>' \
              '<html lang="en">' \
              '<head>' \
              '<meta charset="UTF-8">' \
              '<title>Allure Report</title>' \
              '</head>' \
              '<body>' \
              '<h1>No Allure results</h1>' \
              '<p>No test results were produced for this configuration.</p>' \
              '</body>' \
              '</html>' \
              > allure-report/index.html

          fi

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: selenium-allure-${{ inputs.os_name }}-java-${{ inputs.java }}-${{ inputs.browser }}
          path: allure-report/
          if-no-files-found: error