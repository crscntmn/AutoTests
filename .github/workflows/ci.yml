name: Selenium CI

on:
  workflow_call:
    inputs:
      suite:
        description: Test suite
        required: true
        type: string

      os:
        description: Operating system
        required: true
        type: string

      java:
        description: Java version
        required: true
        type: string

      browser:
        description: Browser
        required: true
        type: string

permissions:
  contents: read

jobs:

  selenium-tests:

    name: Selenium tests

    runs-on: ${{ inputs.os }}

    env:
      PASSWORD: ${{ secrets.PASSWORD }}
      SHORT_PASSWORD: ${{ secrets.SHORT_PASSWORD }}
      INVALIDATE_PASSWORD: ${{ secrets.INVALIDATE_PASSWORD }}
      WRONG_PASSWORD: ${{ secrets.WRONG_PASSWORD }}

      BROWSER: ${{ inputs.browser }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java }}
          cache: maven

      - name: Show environment
        shell: bash
        run: |
          echo "OS: ${{ inputs.os }}"
          echo "Java: ${{ inputs.java }}"
          echo "Browser: ${{ inputs.browser }}"

          java -version
          mvn -version

      - name: Run all tests
        if: inputs.suite == 'all'
        run: mvn clean test

      - name: Run tagged tests
        if: inputs.suite == 'smoke' || inputs.suite == 'regression'
        run: mvn clean test -Dgroups=${{ inputs.suite }}

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-${{ inputs.os }}-java-${{ inputs.java }}-${{ inputs.browser }}
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Install Allure CLI
        if: always()
        shell: bash
        run: |
          curl -Lo allure.tgz \
            https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz

          tar -xzf allure.tgz

      - name: Generate Allure report
        if: always()
        shell: bash
        run: |
          rm -rf allure-report

          if [ -d "allure-results" ] && [ "$(find allure-results -type f | wc -l)" -gt 0 ]; then

            ./allure-2.34.1/bin/allure generate \
              allure-results \
              --clean \
              -o allure-report

            test -f allure-report/index.html

          else

            mkdir -p allure-report

            printf '%s\n' \
              '<!DOCTYPE html>' \
              '<html lang="en">' \
              '<head>' \
              '<meta charset="UTF-8">' \
              '<title>Allure Report</title>' \
              '</head>' \
              '<body>' \
              '<h1>No Allure results</h1>' \
              '<p>No test results were produced for this configuration.</p>' \
              '</body>' \
              '</html>' \
              > allure-report/index.html

          fi

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: selenium-allure-${{ matrix.os-name }}-java-${{ matrix.java }}-${{ matrix.browser }}
          path: allure-report/
          if-no-files-found: error