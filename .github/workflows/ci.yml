name: Selenium CI

on:
  push:
    branches:
      - main
      - develop

workflow_dispatch:
  inputs:
    suite:
      description: 'Test suite'
      required: true
      default: 'all'
      type: choice
      options:
        - all
        - smoke
        - regression

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PASSWORD: ${{ secrets.PASSWORD }}
      SHORT_PASSWORD: ${{ secrets.SHORT_PASSWORD }}
      INVALIDATE_PASSWORD: ${{ secrets.INVALIDATE_PASSWORD }}
      WRONG_PASSWORD: ${{ secrets.WRONG_PASSWORD }}


    strategy:
      matrix:
        java: [17, 21]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Tests (Java ${{ matrix.java }})
        run: mvn clean test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
              name: surefire-reports-java-${{ matrix.java }}
              path: target/surefire-reports/