name: Selenium CI

on:
  workflow_call:
    inputs:
      suite:
        description: Test suite
        required: true
        type: string

permissions:
  contents: read

jobs:

  selenium-tests:

    name: Selenium tests (${{ matrix.os-name }} / Java ${{ matrix.java }} / ${{ matrix.browser }})

    outputs:
      run_id: ${{ github.run_id }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            os-name: ubuntu
            java: 17
            browser: chrome

          - os: ubuntu-latest
            os-name: ubuntu
            java: 17
            browser: firefox

          - os: ubuntu-latest
            os-name: ubuntu
            java: 17
            browser: edge

          - os: ubuntu-latest
            os-name: ubuntu
            java: 21
            browser: chrome

          - os: ubuntu-latest
            os-name: ubuntu
            java: 21
            browser: firefox

          - os: ubuntu-latest
            os-name: ubuntu
            java: 21
            browser: edge

          - os: windows-latest
            os-name: windows
            java: 17
            browser: chrome

          - os: windows-latest
            os-name: windows
            java: 17
            browser: firefox

          - os: windows-latest
            os-name: windows
            java: 17
            browser: edge

          - os: windows-latest
            os-name: windows
            java: 21
            browser: chrome

          - os: windows-latest
            os-name: windows
            java: 21
            browser: firefox

          - os: windows-latest
            os-name: windows
            java: 21
            browser: edge

          - os: macos-latest
            os-name: macos
            java: 17
            browser: chrome

          - os: macos-latest
            os-name: macos
            java: 17
            browser: firefox

          - os: macos-latest
            os-name: macos
            java: 17
            browser: edge

          - os: macos-latest
            os-name: macos
            java: 21
            browser: chrome

          - os: macos-latest
            os-name: macos
            java: 21
            browser: firefox

          - os: macos-latest
            os-name: macos
            java: 21
            browser: edge


    env:
      PASSWORD: ${{ secrets.PASSWORD }}
      SHORT_PASSWORD: ${{ secrets.SHORT_PASSWORD }}
      INVALIDATE_PASSWORD: ${{ secrets.INVALIDATE_PASSWORD }}
      WRONG_PASSWORD: ${{ secrets.WRONG_PASSWORD }}

      BROWSER: ${{ matrix.browser }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Show environment
        shell: bash
        run: |
          echo "OS: ${{ matrix.os-name }}"
          echo "Java: ${{ matrix.java }}"
          echo "Browser: ${{ matrix.browser }}"

          java -version
          mvn -version

      - name: Run all tests
        if: inputs.suite == 'all'
        run: mvn clean test

      - name: Run tagged tests
        if: inputs.suite == 'smoke' || inputs.suite == 'regression'
        run: mvn clean test -Dgroups=${{ inputs.suite }}

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-${{ matrix.os-name }}-java-${{ matrix.java }}-${{ matrix.browser }}
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-results-${{ matrix.os-name }}-java-${{ matrix.java }}-${{ matrix.browser }}
          path: allure-results/
          if-no-files-found: warn

  allure-report:

    name: Generate Selenium Allure Report

    runs-on: ubuntu-latest

    needs: selenium-tests

    if: always()

    steps:

      - name: Download all Allure results
        uses: actions/download-artifact@v6
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Show Allure results
        run: |
          echo "===== ALL ALLURE RESULTS ====="

          find allure-results -type f | head -100

          echo ""
          echo "Total files:"
          find allure-results -type f | wc -l

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Allure CLI
        run: |
          curl -Lo allure.tgz \
            https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz

          tar -xzf allure.tgz

      - name: Generate Selenium Allure report
        run: |
          if [ "$(find allure-results -type f | wc -l)" -gt 0 ]; then

            ./allure-2.34.1/bin/allure generate \
              allure-results \
              --clean \
              -o selenium-allure-report

          else

            mkdir -p selenium-allure-report

            cat > selenium-allure-report/index.html <<'EOF'
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="UTF-8">
              <title>Selenium Allure Report</title>
            </head>
            <body>
              <h1>No Allure results</h1>
              <p>No test results were produced.</p>
            </body>
            </html>
            EOF

          fi

      - name: Verify Selenium Allure report
        run: |
          test -f selenium-allure-report/index.html

      - name: Upload Selenium Allure report
        uses: actions/upload-artifact@v6
        with:
          name: selenium-allure-report
          path: selenium-allure-report/
          if-no-files-found: error