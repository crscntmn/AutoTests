name: Allure Pages

on:
  workflow_run:
    workflows:
      - Selenium CI
      - Docker Selenium CI
    types:
      - completed
    branches:
      - develop

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: allure-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Allure Reports
    runs-on: ubuntu-latest

    if: github.event.workflow_run.conclusion == 'success'

    steps:
      # ============================================================
      # 1. Берём текущие опубликованные отчёты из отдельной ветки
      # ============================================================

      - name: Checkout Allure data branch
        uses: actions/checkout@v4
        with:
          ref: allure-pages-data
          fetch-depth: 0

      # ============================================================
      # 2. Информация о CI, который запустил этот workflow
      # ============================================================

      - name: Show triggering workflow
        run: |
          echo "Workflow: ${{ github.event.workflow_run.name }}"
          echo "Run ID: ${{ github.event.workflow_run.id }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}"

      # ============================================================
      # 3. Подготавливаем директории
      # ============================================================

      - name: Prepare report directories
        run: |
          mkdir -p selenium
          mkdir -p docker

      # ============================================================
      # 4. Если завершился Selenium CI —
      #    скачиваем ЕГО конкретный Allure report
      # ============================================================

      - name: Download Selenium Allure report
        if: github.event.workflow_run.name == 'Selenium CI'
        uses: actions/download-artifact@v6
        with:
          name: selenium-allure-report
          path: selenium
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # ============================================================
      # 5. Если завершился Docker CI —
      #    скачиваем ЕГО конкретный Allure report
      # ============================================================

      - name: Download Docker Allure report
        if: github.event.workflow_run.name == 'Docker Selenium CI'
        uses: actions/download-artifact@v6
        with:
          name: docker-allure-report
          path: docker
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # ============================================================
      # 6. Проверяем скачанный Selenium report
      # ============================================================

      - name: Verify Selenium report
        if: github.event.workflow_run.name == 'Selenium CI'
        run: |
          echo "===== SELENIUM REPORT ====="

          find selenium -maxdepth 2 -type f | head -30

          test -f selenium/index.html

      # ============================================================
      # 7. Проверяем скачанный Docker report
      # ============================================================

      - name: Verify Docker report
        if: github.event.workflow_run.name == 'Docker Selenium CI'
        run: |
          echo "===== DOCKER REPORT ====="

          find docker -maxdepth 2 -type f | head -30

          test -f docker/index.html

      # ============================================================
      # 8. Показываем, что уже хранится в data branch
      # ============================================================

      - name: Show stored reports
        run: |
          echo "===== STORED SELENIUM REPORT ====="

          if [ -f selenium/index.html ]; then
            echo "Selenium report exists."
          else
            echo "Selenium report does not exist yet."
          fi

          echo ""

          echo "===== STORED DOCKER REPORT ====="

          if [ -f docker/index.html ]; then
            echo "Docker report exists."
          else
            echo "Docker report does not exist yet."
          fi

      # ============================================================
      # 9. Формируем Pages
      # ============================================================

      - name: Prepare Pages directory
        run: |
          rm -rf pages

          mkdir -p pages/selenium
          mkdir -p pages/docker

          cp -r selenium/. pages/selenium/ 2>/dev/null || true
          cp -r docker/. pages/docker/ 2>/dev/null || true

      # ============================================================
      # 10. Главная страница
      # ============================================================

      - name: Create main index.html
        run: |
          cat > pages/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">

          <head>
            <meta charset="UTF-8">

            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >

            <title>AutoTests — Allure Reports</title>

            <style>
              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;

                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  Roboto,
                  Arial,
                  sans-serif;

                background: #f6f8fa;
                color: #24292f;
              }

              .container {
                max-width: 900px;
                margin: 0 auto;
                padding: 70px 24px;
              }

              h1 {
                margin: 0 0 10px;
                font-size: 36px;
              }

              .subtitle {
                margin-bottom: 45px;
                color: #57606a;
                font-size: 18px;
              }

              .reports {
                display: grid;

                grid-template-columns:
                  repeat(auto-fit, minmax(280px, 1fr));

                gap: 24px;
              }

              .report {
                display: block;

                padding: 30px;

                background: white;

                border: 1px solid #d0d7de;
                border-radius: 12px;

                text-decoration: none;
                color: inherit;

                transition:
                  transform 0.15s ease,
                  box-shadow 0.15s ease;
              }

              .report:hover {
                transform: translateY(-3px);

                box-shadow:
                  0 8px 24px
                  rgba(140, 149, 159, 0.2);
              }

              .report-title {
                margin-bottom: 12px;

                font-size: 22px;
                font-weight: 600;
              }

              .report-description {
                color: #57606a;
                line-height: 1.5;
              }

              .footer {
                margin-top: 50px;

                color: #8c959f;
                font-size: 14px;
              }
            </style>
          </head>

          <body>

            <main class="container">

              <h1>AutoTests</h1>

              <div class="subtitle">
                Allure test reports
              </div>

              <div class="reports">

                <a
                  class="report"
                  href="./selenium/"
                >
                  <div class="report-title">
                    Selenium CI
                  </div>

                  <div class="report-description">
                    Tests executed directly on
                    GitHub Actions.
                  </div>
                </a>

                <a
                  class="report"
                  href="./docker/"
                >
                  <div class="report-title">
                    Docker Selenium CI
                  </div>

                  <div class="report-description">
                    Tests executed inside Docker
                    with Selenium Standalone Chrome.
                  </div>
                </a>

              </div>

              <div class="footer">
                Generated automatically by GitHub Actions.
              </div>

            </main>

          </body>
          </html>
          EOF

      # ============================================================
      # 11. Проверяем структуру Pages
      # ============================================================

      - name: Show Pages structure
        run: |
          echo "===== PAGES STRUCTURE ====="

          find pages -maxdepth 2 -type f | sort | head -100

          echo ""
          echo "===== SELENIUM ====="

          if [ -f pages/selenium/index.html ]; then
            ls -lh pages/selenium/index.html
          else
            echo "Selenium report is not available."
          fi

          echo ""
          echo "===== DOCKER ====="

          if [ -f pages/docker/index.html ]; then
            ls -lh pages/docker/index.html
          else
            echo "Docker report is not available."
          fi

      # ============================================================
      # 12. Обновляем allure-pages-data
      # ============================================================

      - name: Update Allure data branch
        run: |
          rm -rf selenium
          rm -rf docker

          mkdir -p selenium
          mkdir -p docker

          cp -r pages/selenium/. selenium/ 2>/dev/null || true
          cp -r pages/docker/. docker/ 2>/dev/null || true

      # ============================================================
      # 13. Commit только в allure-pages-data
      # ============================================================

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit reports
        run: |
          git add selenium docker

          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit \
              -m "Update ${{ github.event.workflow_run.name }} report #${{ github.event.workflow_run.id }}"

            git push origin allure-pages-data
          fi

      # ============================================================
      # 14. GitHub Pages
      # ============================================================

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4