name: Allure Pages

on:
  workflow_call:
    inputs:
      selenium_run_id:
        description: Selenium CI workflow run ID
        required: true
        type: string

      docker_run_id:
        description: Docker Selenium CI workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    name: Publish Allure Reports
    runs-on: ubuntu-latest

    steps:
      - name: Prepare directories
        run: |
          mkdir -p pages/selenium
          mkdir -p pages/docker

      - name: Download Selenium Allure report
        uses: actions/download-artifact@v6
        with:
          name: selenium-allure-report
          path: pages/selenium
          run-id: ${{ inputs.selenium_run_id }}
          github-token: ${{ github.token }}

      - name: Download Docker Allure report
        uses: actions/download-artifact@v6
        with:
          name: docker-allure-report
          path: pages/docker
          run-id: ${{ inputs.docker_run_id }}
          github-token: ${{ github.token }}

      - name: Verify reports
        run: |
          echo "===== SELENIUM ====="
          test -f pages/selenium/index.html

          echo "===== DOCKER ====="
          test -f pages/docker/index.html

      - name: Create main index.html
        run: |
          cat > pages/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>AutoTests — Allure Reports</title>

            <style>
              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  Roboto,
                  Arial,
                  sans-serif;
                background: #f6f8fa;
                color: #24292f;
              }

              .container {
                max-width: 900px;
                margin: 0 auto;
                padding: 70px 24px;
              }

              h1 {
                margin: 0 0 10px;
                font-size: 36px;
              }

              .subtitle {
                margin-bottom: 45px;
                color: #57606a;
                font-size: 18px;
              }

              .reports {
                display: grid;
                grid-template-columns:
                  repeat(auto-fit, minmax(280px, 1fr));
                gap: 24px;
              }

              .report {
                display: block;
                padding: 30px;
                background: white;
                border: 1px solid #d0d7de;
                border-radius: 12px;
                text-decoration: none;
                color: inherit;
                transition:
                  transform 0.15s ease,
                  box-shadow 0.15s ease;
              }

              .report:hover {
                transform: translateY(-3px);
                box-shadow:
                  0 8px 24px
                  rgba(140, 149, 159, 0.2);
              }

              .report-title {
                margin-bottom: 12px;
                font-size: 22px;
                font-weight: 600;
              }

              .report-description {
                color: #57606a;
                line-height: 1.5;
              }

              .footer {
                margin-top: 50px;
                color: #8c959f;
                font-size: 14px;
              }
            </style>
          </head>

          <body>
            <main class="container">

              <h1>AutoTests</h1>

              <div class="subtitle">
                Allure test reports
              </div>

              <div class="reports">

                <a class="report" href="./selenium/">
                  <div class="report-title">
                    Selenium CI
                  </div>

                  <div class="report-description">
                    Tests executed directly on GitHub Actions.
                  </div>
                </a>

                <a class="report" href="./docker/">
                  <div class="report-title">
                    Docker Selenium CI
                  </div>

                  <div class="report-description">
                    Tests executed inside Docker with
                    Selenium Standalone Chrome.
                  </div>
                </a>

              </div>

              <div class="footer">
                Generated automatically by GitHub Actions.
              </div>

            </main>
          </body>
          </html>
          EOF

      - name: Show Pages structure
        run: |
          echo "===== PAGES STRUCTURE ====="
          find pages -maxdepth 2 -type f | sort | head -100

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4