name: Allure Pages

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    name: Publish Allure Reports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download Selenium Allure report
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: selenium-ci.yml
          workflow_conclusion: success
          name: selenium-allure-report
          path: reports/selenium
          search_artifacts: true

      - name: Download Docker Allure report
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: docker-ci.yml
          workflow_conclusion: success
          name: docker-allure-report
          path: reports/docker
          search_artifacts: true

      - name: Show downloaded reports
        run: |
          echo "===== SELENIUM REPORT ====="
          find reports/selenium -maxdepth 2 -type f | head -50

          echo "===== DOCKER REPORT ====="
          find reports/docker -maxdepth 2 -type f | head -50

      - name: Create landing page
        run: |
          cat > reports/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>AutoTests Allure Reports</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                max-width: 800px;
                margin: 80px auto;
                text-align: center;
              }

              h1 {
                margin-bottom: 40px;
              }

              a {
                display: block;
                margin: 20px;
                padding: 20px;
                background: #f3f3f3;
                border-radius: 10px;
                text-decoration: none;
                color: #222;
                font-size: 20px;
              }

              a:hover {
                background: #e5e5e5;
              }
            </style>
          </head>

          <body>
            <h1>AutoTests Allure Reports</h1>

            <a href="./selenium/">
              Selenium CI — Allure Report
            </a>

            <a href="./docker/">
              Docker Selenium CI — Allure Report
            </a>
          </body>
          </html>
          EOF

      - name: Prepare report directories
        run: |
          mkdir -p reports/selenium
          mkdir -p reports/docker

          echo "Selenium files:"
          find reports/selenium -type f | head

          echo "Docker files:"
          find reports/docker -type f | head

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: reports

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4