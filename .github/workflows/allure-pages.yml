name: Allure Pages

on:
  push:
    branches:
      - develop

  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  publish-allure:
    name: Publish Selenium and Docker Allure Reports
    runs-on: ubuntu-latest

    steps:
      - name: Find latest successful Selenium CI run
        id: selenium-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "ci.yml" \
            --branch develop \
            --status success \
            --limit 1 \
            --json databaseId,headSha,createdAt \
            --jq '.[0].databaseId')

          echo "Latest Selenium CI run: $RUN_ID"

          if [ -z "$RUN_ID" ]; then
            echo "Selenium CI successful run not found"
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Find latest successful Docker Selenium CI run
        id: docker-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "docker-ci.yml" \
            --branch develop \
            --status success \
            --limit 1 \
            --json databaseId,headSha,createdAt \
            --jq '.[0].databaseId')

          echo "Latest Docker Selenium CI run: $RUN_ID"

          if [ -z "$RUN_ID" ]; then
            echo "Docker Selenium CI successful run not found"
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Show selected CI runs
        run: |
          echo "========================================"
          echo "Selected Selenium CI run:"
          echo "${{ steps.selenium-run.outputs.run_id }}"
          echo ""
          echo "Selected Docker Selenium CI run:"
          echo "${{ steps.docker-run.outputs.run_id }}"
          echo "========================================"

      - name: Prepare reports directories
        run: |
          mkdir -p pages/selenium
          mkdir -p pages/docker

      - name: Download Selenium Allure report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Downloading Selenium Allure report..."

          gh run download \
            "${{ steps.selenium-run.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name selenium-allure-report \
            --dir pages/selenium

      - name: Download Docker Allure report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Downloading Docker Allure report..."

          gh run download \
            "${{ steps.docker-run.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name docker-allure-report \
            --dir pages/docker

      - name: Verify Selenium report
        run: |
          echo "===== SELENIUM REPORT ====="

          find pages/selenium -maxdepth 2 -type f | head -50

          if [ ! -f pages/selenium/index.html ]; then
            echo "Selenium Allure index.html not found"
            exit 1
          fi

      - name: Verify Docker report
        run: |
          echo "===== DOCKER REPORT ====="

          find pages/docker -maxdepth 2 -type f | head -50

          if [ ! -f pages/docker/index.html ]; then
            echo "Docker Allure index.html not found"
            exit 1
          fi

      - name: Create main Allure page
        run: |
          cat > pages/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>AutoTests — Allure Reports</title>

            <style>
              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  Roboto,
                  Arial,
                  sans-serif;

                background: #f6f8fa;
                color: #24292f;
              }

              .container {
                max-width: 900px;
                margin: 0 auto;
                padding: 70px 24px;
              }

              h1 {
                margin: 0 0 10px;
                font-size: 36px;
              }

              .subtitle {
                margin-bottom: 45px;
                color: #57606a;
                font-size: 18px;
              }

              .reports {
                display: grid;
                grid-template-columns:
                  repeat(auto-fit, minmax(280px, 1fr));

                gap: 24px;
              }

              .report {
                display: block;
                padding: 30px;

                background: white;

                border: 1px solid #d0d7de;
                border-radius: 12px;

                text-decoration: none;
                color: inherit;

                transition:
                  transform 0.15s ease,
                  box-shadow 0.15s ease;
              }

              .report:hover {
                transform: translateY(-3px);

                box-shadow:
                  0 8px 24px rgba(140, 149, 159, 0.2);
              }

              .report-title {
                margin-bottom: 12px;

                font-size: 22px;
                font-weight: 600;
              }

              .report-description {
                color: #57606a;
                line-height: 1.5;
              }

              .footer {
                margin-top: 50px;

                color: #8c959f;
                font-size: 14px;
              }
            </style>
          </head>

          <body>

            <main class="container">

              <h1>AutoTests</h1>

              <div class="subtitle">
                Allure test reports
              </div>

              <div class="reports">

                <a
                  class="report"
                  href="./selenium/"
                >
                  <div class="report-title">
                    Selenium CI
                  </div>

                  <div class="report-description">
                    Automated tests executed directly
                    on GitHub Actions.
                  </div>
                </a>

                <a
                  class="report"
                  href="./docker/"
                >
                  <div class="report-title">
                    Docker Selenium CI
                  </div>

                  <div class="report-description">
                    Automated tests executed inside Docker
                    with Selenium Standalone Chrome.
                  </div>
                </a>

              </div>

              <div class="footer">
                Generated automatically by GitHub Actions.
              </div>

            </main>

          </body>
          </html>
          EOF

      - name: Show final Pages structure
        run: |
          echo "========================================"
          echo "FINAL GITHUB PAGES STRUCTURE"
          echo "========================================"

          find pages -maxdepth 2 -type f | sort | head -100

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4