name: Allure Pages

on:
  push:
    branches:
      - develop

  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    name: Publish Selenium and Docker Allure Reports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout reports branch
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      # ============================================================
      # FIND SELENIUM CI RUN FOR CURRENT COMMIT
      # ============================================================

      - name: Wait for Selenium CI
        id: selenium
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          echo "Current commit: $CURRENT_SHA"
          echo "Waiting for Selenium CI..."

          for i in {1..60}; do

            RUN_INFO=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow "ci.yml" \
              --branch develop \
              --limit 20 \
              --json databaseId,headSha,status,conclusion \
              --jq ".[] | select(.headSha == \"$CURRENT_SHA\")" \
              | head -1)

            if [ -n "$RUN_INFO" ]; then

              RUN_ID=$(echo "$RUN_INFO" | jq -r '.databaseId')
              STATUS=$(echo "$RUN_INFO" | jq -r '.status')
              CONCLUSION=$(echo "$RUN_INFO" | jq -r '.conclusion')

              echo "Selenium CI:"
              echo "  Run ID: $RUN_ID"
              echo "  Status: $STATUS"
              echo "  Conclusion: $CONCLUSION"

              if [ "$STATUS" = "completed" ]; then

                if [ "$CONCLUSION" = "success" ]; then
                  echo "Selenium CI completed successfully."
                  echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
                  break
                else
                  echo "Selenium CI failed."
                  exit 1
                fi

              fi
            else
              echo "Selenium CI run for current SHA not found yet."
            fi

            if [ "$i" -eq 60 ]; then
              echo "Selenium CI timeout."
              exit 1
            fi

            echo "Waiting... attempt $i/60"
            sleep 10
          done

      # ============================================================
      # FIND DOCKER CI RUN FOR CURRENT COMMIT
      # ============================================================

      - name: Wait for Docker Selenium CI
        id: docker
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          echo "Current commit: $CURRENT_SHA"
          echo "Waiting for Docker Selenium CI..."

          for i in {1..60}; do

            RUN_INFO=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow "docker-ci.yml" \
              --branch develop \
              --limit 20 \
              --json databaseId,headSha,status,conclusion \
              --jq ".[] | select(.headSha == \"$CURRENT_SHA\")" \
              | head -1)

            if [ -n "$RUN_INFO" ]; then

              RUN_ID=$(echo "$RUN_INFO" | jq -r '.databaseId')
              STATUS=$(echo "$RUN_INFO" | jq -r '.status')
              CONCLUSION=$(echo "$RUN_INFO" | jq -r '.conclusion')

              echo "Docker Selenium CI:"
              echo "  Run ID: $RUN_ID"
              echo "  Status: $STATUS"
              echo "  Conclusion: $CONCLUSION"

              if [ "$STATUS" = "completed" ]; then

                if [ "$CONCLUSION" = "success" ]; then
                  echo "Docker Selenium CI completed successfully."
                  echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
                  break
                else
                  echo "Docker Selenium CI failed."
                  exit 1
                fi

              fi
            else
              echo "Docker Selenium CI run for current SHA not found yet."
            fi

            if [ "$i" -eq 60 ]; then
              echo "Docker Selenium CI timeout."
              exit 1
            fi

            echo "Waiting... attempt $i/60"
            sleep 10
          done

      # ============================================================
      # PREPARE REPORT DIRECTORIES
      # ============================================================

      - name: Prepare report directories
        run: |
          mkdir -p selenium
          mkdir -p docker
          mkdir -p pages/selenium
          mkdir -p pages/docker

      # ============================================================
      # DOWNLOAD SELENIUM REPORT
      # ============================================================

      - name: Download Selenium Allure report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf selenium/*

          gh run download \
            "${{ steps.selenium.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name selenium-allure-report \
            --dir selenium

      # ============================================================
      # DOWNLOAD DOCKER REPORT
      # ============================================================

      - name: Download Docker Allure report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf docker/*

          gh run download \
            "${{ steps.docker.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name docker-allure-report \
            --dir docker

      # ============================================================
      # VERIFY REPORTS
      # ============================================================

      - name: Verify Selenium report
        run: |
          echo "===== SELENIUM REPORT ====="
          find selenium -maxdepth 2 -type f | head -30

          test -f selenium/index.html

      - name: Verify Docker report
        run: |
          echo "===== DOCKER REPORT ====="
          find docker -maxdepth 2 -type f | head -30

          test -f docker/index.html

      # ============================================================
      # COPY REPORTS TO PAGES
      # ============================================================

      - name: Copy reports to Pages
        run: |
          cp -r selenium/. pages/selenium/
          cp -r docker/. pages/docker/

      # ============================================================
      # MAIN PAGE
      # ============================================================

      - name: Create main index.html
        run: |
          cat > pages/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>AutoTests — Allure Reports</title>

            <style>
              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  Roboto,
                  Arial,
                  sans-serif;
                background: #f6f8fa;
                color: #24292f;
              }

              .container {
                max-width: 900px;
                margin: 0 auto;
                padding: 70px 24px;
              }

              h1 {
                margin: 0 0 10px;
                font-size: 36px;
              }

              .subtitle {
                margin-bottom: 45px;
                color: #57606a;
                font-size: 18px;
              }

              .reports {
                display: grid;
                grid-template-columns:
                  repeat(auto-fit, minmax(280px, 1fr));
                gap: 24px;
              }

              .report {
                display: block;
                padding: 30px;
                background: white;
                border: 1px solid #d0d7de;
                border-radius: 12px;
                text-decoration: none;
                color: inherit;
                transition:
                  transform 0.15s ease,
                  box-shadow 0.15s ease;
              }

              .report:hover {
                transform: translateY(-3px);
                box-shadow:
                  0 8px 24px rgba(140, 149, 159, 0.2);
              }

              .report-title {
                margin-bottom: 12px;
                font-size: 22px;
                font-weight: 600;
              }

              .report-description {
                color: #57606a;
                line-height: 1.5;
              }

              .footer {
                margin-top: 50px;
                color: #8c959f;
                font-size: 14px;
              }
            </style>
          </head>

          <body>

            <main class="container">

              <h1>AutoTests</h1>

              <div class="subtitle">
                Allure test reports
              </div>

              <div class="reports">

                <a class="report" href="./selenium/">
                  <div class="report-title">
                    Selenium CI
                  </div>

                  <div class="report-description">
                    Tests executed directly on GitHub Actions.
                  </div>
                </a>

                <a class="report" href="./docker/">
                  <div class="report-title">
                    Docker Selenium CI
                  </div>

                  <div class="report-description">
                    Tests executed inside Docker with
                    Selenium Standalone Chrome.
                  </div>
                </a>

              </div>

              <div class="footer">
                Generated automatically by GitHub Actions.
              </div>

            </main>

          </body>
          </html>
          EOF

      # ============================================================
      # SHOW STRUCTURE
      # ============================================================

      - name: Show Pages structure
        run: |
          echo "===== PAGES STRUCTURE ====="

          find pages -maxdepth 2 -type f | sort | head -100

          echo ""
          echo "===== SELENIUM INDEX ====="
          ls -lh pages/selenium/index.html

          echo ""
          echo "===== DOCKER INDEX ====="
          ls -lh pages/docker/index.html

      # ============================================================
      # UPDATE DATA BRANCH
      # ============================================================

      - name: Update reports on data branch
        run: |
          rm -rf selenium
          rm -rf docker

          cp -r pages/selenium selenium
          cp -r pages/docker docker

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit reports
        run: |
          git add selenium docker

          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "Update Allure reports for ${{ github.sha }}"
            git push origin develop
          fi

      # ============================================================
      # DEPLOY GITHUB PAGES
      # ============================================================

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4