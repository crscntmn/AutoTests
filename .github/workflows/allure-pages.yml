name: Allure Pages

on:
  push:
    branches:
      - develop

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  publish-allure:
    name: Publish Selenium and Docker Allure Reports
    runs-on: ubuntu-latest

    steps:
      - name: Prepare reports directory
        run: |
          mkdir -p pages/selenium
          mkdir -p pages/docker

      - name: Find latest successful Selenium CI run
        id: selenium-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "selenium-ci.yml" \
            --branch develop \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          echo "Selenium CI run: $RUN_ID"

          if [ -z "$RUN_ID" ]; then
            echo "Selenium CI successful run not found"
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Find latest successful Docker Selenium CI run
        id: docker-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "docker-ci.yml" \
            --branch develop \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          echo "Docker Selenium CI run: $RUN_ID"

          if [ -z "$RUN_ID" ]; then
            echo "Docker Selenium CI successful run not found"
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download Selenium Allure report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download \
            "${{ steps.selenium-run.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name selenium-allure-report \
            --dir pages/selenium

      - name: Download Docker Allure report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download \
            "${{ steps.docker-run.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name docker-allure-report \
            --dir pages/docker

      - name: Show Pages structure
        run: |
          echo "===== SELENIUM REPORT ====="
          find pages/selenium -maxdepth 2 -type f | head -50

          echo "===== DOCKER REPORT ====="
          find pages/docker -maxdepth 2 -type f | head -50

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4