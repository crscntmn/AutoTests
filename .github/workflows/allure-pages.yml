name: Allure Pages

on:
  workflow_dispatch:
    inputs:
      report:
        description: Report to publish
        required: true
        type: choice
        options:
          - selenium
          - docker

      run_id:
        description: CI workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: allure-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.report }} Allure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout reports data branch
        uses: actions/checkout@v4
        with:
          ref: allure-pages-data
          fetch-depth: 0

      - name: Show current reports
        run: |
          echo "===== CURRENT REPORTS ====="

          if [ -f selenium/index.html ]; then
            echo "Selenium report exists"
          else
            echo "Selenium report does not exist"
          fi

          if [ -f docker/index.html ]; then
            echo "Docker report exists"
          else
            echo "Docker report does not exist"
          fi

      - name: Prepare directories
        run: |
          mkdir -p selenium
          mkdir -p docker
          mkdir -p pages/selenium
          mkdir -p pages/docker

      - name: Download Selenium Allure report
        if: inputs.report == 'selenium'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Downloading Selenium report from run ${{ inputs.run_id }}"

          rm -rf selenium/*

          gh run download \
            "${{ inputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name selenium-allure-report \
            --dir selenium

      - name: Download Docker Allure report
        if: inputs.report == 'docker'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Downloading Docker report from run ${{ inputs.run_id }}"

          rm -rf docker/*

          gh run download \
            "${{ inputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name docker-allure-report \
            --dir docker

      - name: Verify Selenium report
        if: inputs.report == 'selenium'
        run: |
          echo "===== SELENIUM REPORT ====="

          find selenium \
            -maxdepth 2 \
            -type f | head -30

          test -f selenium/index.html

      - name: Verify Docker report
        if: inputs.report == 'docker'
        run: |
          echo "===== DOCKER REPORT ====="

          find docker \
            -maxdepth 2 \
            -type f | head -30

          test -f docker/index.html

      - name: Copy reports to Pages
        run: |
          rm -rf pages/selenium
          rm -rf pages/docker

          mkdir -p pages/selenium
          mkdir -p pages/docker

          if [ -f selenium/index.html ]; then
            cp -r selenium/. pages/selenium/
          fi

          if [ -f docker/index.html ]; then
            cp -r docker/. pages/docker/
          fi

      - name: Create main index.html
        run: |
          cat > pages/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>AutoTests — Allure Reports</title>

            <style>
              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  Roboto,
                  Arial,
                  sans-serif;
                background: #f6f8fa;
                color: #24292f;
              }

              .container {
                max-width: 900px;
                margin: 0 auto;
                padding: 70px 24px;
              }

              h1 {
                margin: 0 0 10px;
                font-size: 36px;
              }

              .subtitle {
                margin-bottom: 45px;
                color: #57606a;
                font-size: 18px;
              }

              .reports {
                display: grid;
                grid-template-columns:
                  repeat(auto-fit, minmax(280px, 1fr));
                gap: 24px;
              }

              .report {
                display: block;
                padding: 30px;
                background: white;
                border: 1px solid #d0d7de;
                border-radius: 12px;
                text-decoration: none;
                color: inherit;
                transition:
                  transform 0.15s ease,
                  box-shadow 0.15s ease;
              }

              .report:hover {
                transform: translateY(-3px);
                box-shadow:
                  0 8px 24px rgba(140, 149, 159, 0.2);
              }

              .report-title {
                margin-bottom: 12px;
                font-size: 22px;
                font-weight: 600;
              }

              .report-description {
                color: #57606a;
                line-height: 1.5;
              }

              .footer {
                margin-top: 50px;
                color: #8c959f;
                font-size: 14px;
              }
            </style>
          </head>

          <body>

            <main class="container">

              <h1>AutoTests</h1>

              <div class="subtitle">
                Allure test reports
              </div>

              <div class="reports">

                <a class="report" href="./selenium/">
                  <div class="report-title">
                    Selenium CI
                  </div>

                  <div class="report-description">
                    Tests executed directly on GitHub Actions.
                  </div>
                </a>

                <a class="report" href="./docker/">
                  <div class="report-title">
                    Docker Selenium CI
                  </div>

                  <div class="report-description">
                    Tests executed inside Docker with
                    Selenium Standalone Chrome.
                  </div>
                </a>

              </div>

              <div class="footer">
                Generated automatically by GitHub Actions.
              </div>

            </main>

          </body>
          </html>
          EOF

      - name: Show Pages structure
        run: |
          echo "===== PAGES STRUCTURE ====="

          find pages -maxdepth 2 -type f | sort | head -100

          echo ""
          echo "===== SELENIUM INDEX ====="

          if [ -f pages/selenium/index.html ]; then
            ls -lh pages/selenium/index.html
          else
            echo "Selenium report is not present"
          fi

          echo ""
          echo "===== DOCKER INDEX ====="

          if [ -f pages/docker/index.html ]; then
            ls -lh pages/docker/index.html
          else
            echo "Docker report is not present"
          fi

      - name: Update reports data branch
        run: |
          rm -rf selenium
          rm -rf docker

          mkdir -p selenium
          mkdir -p docker

          if [ -f pages/selenium/index.html ]; then
            cp -r pages/selenium/. selenium/
          fi

          if [ -f pages/docker/index.html ]; then
            cp -r pages/docker/. docker/
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit reports
        run: |
          git add selenium docker

          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit \
              -m "Update ${{ inputs.report }} Allure report from run ${{ inputs.run_id }}"

            git push origin develop
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4