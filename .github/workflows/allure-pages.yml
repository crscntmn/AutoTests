name: Allure Pages

on:
  workflow_call:
    inputs:

      selenium_run_id:
        description: Selenium CI workflow run ID
        required: true
        type: string

      docker_run_id:
        description: Docker CI workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:

  publish:

    name: Publish Allure Reports

    runs-on: ubuntu-latest

    steps:

      - name: Prepare directories
        run: |
          rm -rf pages
          rm -rf downloaded-selenium
          rm -rf downloaded-docker

          mkdir -p pages/selenium
          mkdir -p pages/docker

          mkdir -p downloaded-selenium
          mkdir -p downloaded-docker

      - name: Download all Selenium Allure reports
        uses: actions/download-artifact@v6
        with:
          pattern: selenium-allure-*
          path: downloaded-selenium
          run-id: ${{ inputs.selenium_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: false

      - name: Download Docker Allure report
        uses: actions/download-artifact@v6
        with:
          name: docker-allure-report
          path: downloaded-docker
          run-id: ${{ inputs.docker_run_id }}
          github-token: ${{ github.token }}

      - name: Show downloaded reports
        run: |
          echo "===== SELENIUM ARTIFACTS ====="
          find downloaded-selenium -type f | sed -n '1,100p'

          echo ""
          echo "===== DOCKER ARTIFACTS ====="
          find downloaded-docker -type f | sed -n '1,100p'

      - name: Prepare Selenium report pages
        shell: bash
        run: |

          for artifact in downloaded-selenium/selenium-allure-*; do

            if [ ! -d "$artifact" ]; then
              continue
            fi

            artifact_name=$(basename "$artifact")

            echo "Processing: $artifact_name"

            # Remove prefix:
            # selenium-allure-
            config="${artifact_name#selenium-allure-}"

            # Expected:
            # ubuntu-java-17-chrome
            # windows-java-21-chrome
            # macos-java-17-safari

            os="${config%%-java-*}"

            rest="${config#*-java-}"

            java="${rest%%-*}"

            browser="${rest#*-}"

            echo "OS: $os"
            echo "Java: $java"
            echo "Browser: $browser"

            target="pages/selenium/$os/java-$java/$browser"

            mkdir -p "$target"

            cp -r "$artifact"/. "$target"/

            if [ ! -f "$target/index.html" ]; then
              echo "ERROR: index.html missing in $artifact_name"
              exit 1
            fi

          done

      - name: Prepare Docker report page
        shell: bash
        run: |

          mkdir -p pages/docker

          cp -r downloaded-docker/. pages/docker/

          test -f pages/docker/index.html

      - name: Create Selenium index
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from html import escape

          root = Path("pages/selenium")

          html = """<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>Selenium Allure Reports</title>

            <style>
              * {
                box-sizing: border-box;
              }

              body {
                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  Roboto,
                  Arial,
                  sans-serif;

                background: #f6f8fa;
                color: #24292f;
                margin: 0;
              }

              .container {
                max-width: 1000px;
                margin: auto;
                padding: 50px 24px;
              }

              h1 {
                margin-bottom: 10px;
              }

              .subtitle {
                color: #57606a;
                margin-bottom: 35px;
              }

              .os {
                background: white;
                border: 1px solid #d0d7de;
                border-radius: 12px;
                padding: 24px;
                margin-bottom: 24px;
              }

              h2 {
                margin-top: 0;
                margin-bottom: 24px;
              }

              .java {
                margin-bottom: 24px;
              }

              .java:last-child {
                margin-bottom: 0;
              }

              .java-title {
                font-size: 17px;
                font-weight: 600;
                margin-bottom: 12px;
              }

              .links {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
              }

              a {
                display: block;
                padding: 12px 16px;
                background: #f6f8fa;
                border: 1px solid #d0d7de;
                border-radius: 8px;
                color: #0969da;
                text-decoration: none;
              }

              a:hover {
                background: #ddf4ff;
              }

              .back {
                margin-bottom: 30px;
              }
            </style>
          </head>

          <body>
          <main class="container">

            <div class="back">
              <a href="../">← All reports</a>
            </div>

            <h1>Selenium Allure Reports</h1>

            <div class="subtitle">
              Reports by operating system, Java version and browser.
            </div>
          """

          for os_dir in sorted(root.iterdir()):
              if not os_dir.is_dir():
                  continue

              os_name = os_dir.name

              html += f"""
            <section class="os">
              <h2>{escape(os_name)}</h2>
          """

              for java_dir in sorted(os_dir.iterdir()):
                  if not java_dir.is_dir():
                      continue

                  java_dir_name = java_dir.name
                  java = java_dir_name.removeprefix("java-")

                  html += f"""
              <div class="java">
                <div class="java-title">
                  Java {escape(java)}
                </div>

                <div class="links">
          """

                  for browser_dir in sorted(java_dir.iterdir()):
                      if not browser_dir.is_dir():
                          continue

                      browser = browser_dir.name

                      html += f"""
                  <a href="./{escape(os_name)}/{escape(java_dir_name)}/{escape(browser)}/">
                    {escape(browser)}
                  </a>
          """

                  html += """
                </div>
              </div>
          """

              html += """
            </section>
          """

          html += """
          </main>
          </body>
          </html>
          """

          (root / "index.html").write_text(html, encoding="utf-8")

          print("Created:", root / "index.html")
          PY

          echo "===== GENERATED SELENIUM INDEX ====="
          sed -n '1,300p' pages/selenium/index.html

      - name: Create main index
        shell: bash
        run: |
          cat > pages/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">

          <head>
            <meta charset="UTF-8">

            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >

            <title>AutoTests — Allure Reports</title>

            <style>
              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;

                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  Roboto,
                  Arial,
                  sans-serif;

                background: #f6f8fa;
                color: #24292f;
              }

              .container {
                max-width: 900px;
                margin: 0 auto;
                padding: 70px 24px;
              }

              h1 {
                margin: 0 0 10px;
                font-size: 36px;
              }

              .subtitle {
                margin-bottom: 45px;
                color: #57606a;
                font-size: 18px;
              }

              .reports {
                display: grid;
                grid-template-columns:
                  repeat(auto-fit, minmax(280px, 1fr));

                gap: 24px;
              }

              .report {
                display: block;

                padding: 30px;

                background: white;

                border: 1px solid #d0d7de;
                border-radius: 12px;

                text-decoration: none;
                color: inherit;

                transition:
                  transform 0.15s ease,
                  box-shadow 0.15s ease;
              }

              .report:hover {
                transform: translateY(-3px);

                box-shadow:
                  0 8px 24px
                  rgba(140, 149, 159, 0.2);
              }

              .report-title {
                margin-bottom: 12px;

                font-size: 22px;
                font-weight: 600;
              }

              .report-description {
                color: #57606a;
                line-height: 1.5;
              }

              .footer {
                margin-top: 50px;
                color: #8c959f;
                font-size: 14px;
              }
            </style>
          </head>

          <body>

          <main class="container">

            <h1>AutoTests</h1>

            <div class="subtitle">
              Allure test reports
            </div>

            <div class="reports">

              <a class="report" href="./selenium/">
                <div class="report-title">
                  Selenium CI
                </div>

                <div class="report-description">
                  Selenium tests grouped by OS,
                  Java version and browser.
                </div>
              </a>

              <a class="report" href="./docker/">
                <div class="report-title">
                  Docker Selenium CI
                </div>

                <div class="report-description">
                  Tests executed inside Docker
                  with Selenium Standalone Chrome.
                </div>
              </a>

            </div>

            <div class="footer">
              Generated automatically by GitHub Actions.
            </div>

          </main>

          </body>
          </html>
          HTML

          echo "===== MAIN INDEX ====="
          sed -n '1,250p' pages/index.html


      - name: Show Pages structure
        shell: bash
        run: |
          echo "===== PAGE STRUCTURE ====="

          find pages -maxdepth 5 -type f | sort | head -300


      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}