name: Allure Pages

on:
  workflow_call:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:

  publish:

    name: Publish Allure Reports

    runs-on: ubuntu-latest

    steps:

      - name: Download Selenium Allure reports
        uses: actions/download-artifact@v6
        with:
          pattern: selenium-allure-*
          path: selenium-reports

      - name: Download Docker Allure reports
        uses: actions/download-artifact@v6
        with:
          pattern: docker-allure-*
          path: docker-reports

      - name: Show downloaded reports
        run: |
          echo "===== SELENIUM REPORTS ====="
          find selenium-reports -maxdepth 3 -type f | sort | head -200 || true

          echo ""
          echo "===== DOCKER REPORTS ====="
          find docker-reports -maxdepth 3 -type f | sort | head -100 || true


      - name: Prepare Pages directory
        run: |
          rm -rf pages

          mkdir -p pages/selenium
          mkdir -p pages/docker


      - name: Build Selenium report structure
        shell: bash
        run: |

          for dir in selenium-reports/selenium-allure-*; do

            [ -d "$dir" ] || continue

            NAME=$(basename "$dir")

            # selenium-allure-ubuntu-java-17-chrome
            CONFIG=${NAME#selenium-allure-}

            OS=$(echo "$CONFIG" | cut -d'-' -f1)

            JAVA=$(echo "$CONFIG" | sed -n 's/.*java-\([0-9]*\)-.*/\1/p')

            BROWSER=$(echo "$CONFIG" | sed -n 's/.*java-[0-9]*-\(.*\)/\1/p')

            TARGET="pages/selenium/$OS/java-$JAVA/$BROWSER"

            mkdir -p "$TARGET"

            cp -r "$dir"/. "$TARGET"/

            echo "Selenium report:"
            echo "  OS: $OS"
            echo "  Java: $JAVA"
            echo "  Browser: $BROWSER"
            echo "  Path: $TARGET"

          done


      - name: Build Docker report structure
        shell: bash
        run: |

          for dir in docker-reports/docker-allure-*; do

            [ -d "$dir" ] || continue

            NAME=$(basename "$dir")

            # docker-allure-chrome
            BROWSER=${NAME#docker-allure-}

            TARGET="pages/docker/$BROWSER"

            mkdir -p "$TARGET"

            cp -r "$dir"/. "$TARGET"/

            echo "Docker report:"
            echo "  Browser: $BROWSER"
            echo "  Path: $TARGET"

          done


      - name: Create Selenium index
        shell: bash
        run: |

          cat > pages/selenium/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">

          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>Selenium CI — Allure Reports</title>

            <style>
              body {
                margin: 0;
                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  Roboto,
                  Arial,
                  sans-serif;
                background: #f6f8fa;
                color: #24292f;
              }

              .container {
                max-width: 1000px;
                margin: auto;
                padding: 60px 24px;
              }

              h1 {
                margin-bottom: 10px;
              }

              .subtitle {
                color: #57606a;
                margin-bottom: 35px;
              }

              h2 {
                margin-top: 35px;
              }

              .grid {
                display: grid;
                grid-template-columns:
                  repeat(auto-fit, minmax(220px, 1fr));
                gap: 16px;
              }

              a {
                display: block;
                padding: 20px;
                background: white;
                border: 1px solid #d0d7de;
                border-radius: 10px;
                text-decoration: none;
                color: inherit;
              }

              a:hover {
                box-shadow: 0 5px 18px
                  rgba(140, 149, 159, 0.2);
              }

              .title {
                font-size: 18px;
                font-weight: 600;
                margin-bottom: 8px;
              }

              .description {
                color: #57606a;
              }

              .back {
                display: inline-block;
                margin-bottom: 30px;
                color: #0969da;
              }
            </style>
          </head>

          <body>

          <main class="container">

            <a class="back" href="../">
              ← Back to Allure Reports
            </a>

            <h1>Selenium CI</h1>

            <div class="subtitle">
              OS × Java × Browser matrix
            </div>

            <h2>Ubuntu</h2>

            <div class="grid">

              <a href="./ubuntu/java-17/chrome/">
                <div class="title">
                  Java 17 — Chrome
                </div>
                <div class="description">
                  Ubuntu
                </div>
              </a>

              <a href="./ubuntu/java-17/firefox/">
                <div class="title">
                  Java 17 — Firefox
                </div>
                <div class="description">
                  Ubuntu
                </div>
              </a>

              <a href="./ubuntu/java-17/edge/">
                <div class="title">
                  Java 17 — Edge
                </div>
                <div class="description">
                  Ubuntu
                </div>
              </a>

              <a href="./ubuntu/java-21/chrome/">
                <div class="title">
                  Java 21 — Chrome
                </div>
                <div class="description">
                  Ubuntu
                </div>
              </a>

              <a href="./ubuntu/java-21/firefox/">
                <div class="title">
                  Java 21 — Firefox
                </div>
                <div class="description">
                  Ubuntu
                </div>
              </a>

              <a href="./ubuntu/java-21/edge/">
                <div class="title">
                  Java 21 — Edge
                </div>
                <div class="description">
                  Ubuntu
                </div>
              </a>

            </div>


            <h2>Windows</h2>

            <div class="grid">

              <a href="./windows/java-17/chrome/">
                <div class="title">
                  Java 17 — Chrome
                </div>
                <div class="description">
                  Windows
                </div>
              </a>

              <a href="./windows/java-17/firefox/">
                <div class="title">
                  Java 17 — Firefox
                </div>
                <div class="description">
                  Windows
                </div>
              </a>

              <a href="./windows/java-17/edge/">
                <div class="title">
                  Java 17 — Edge
                </div>
                <div class="description">
                  Windows
                </div>
              </a>

              <a href="./windows/java-21/chrome/">
                <div class="title">
                  Java 21 — Chrome
                </div>
                <div class="description">
                  Windows
                </div>
              </a>

              <a href="./windows/java-21/firefox/">
                <div class="title">
                  Java 21 — Firefox
                </div>
                <div class="description">
                  Windows
                </div>
              </a>

              <a href="./windows/java-21/edge/">
                <div class="title">
                  Java 21 — Edge
                </div>
                <div class="description">
                  Windows
                </div>
              </a>

            </div>


            <h2>macOS</h2>

            <div class="grid">

              <a href="./macos/java-17/chrome/">
                <div class="title">
                  Java 17 — Chrome
                </div>
                <div class="description">
                  macOS
                </div>
              </a>

              <a href="./macos/java-17/firefox/">
                <div class="title">
                  Java 17 — Firefox
                </div>
                <div class="description">
                  macOS
                </div>
              </a>

              <a href="./macos/java-17/edge/">
                <div class="title">
                  Java 17 — Edge
                </div>
                <div class="description">
                  macOS
                </div>
              </a>

              <a href="./macos/java-21/chrome/">
                <div class="title">
                  Java 21 — Chrome
                </div>
                <div class="description">
                  macOS
                </div>
              </a>

              <a href="./macos/java-21/firefox/">
                <div class="title">
                  Java 21 — Firefox
                </div>
                <div class="description">
                  macOS
                </div>
              </a>

              <a href="./macos/java-21/edge/">
                <div class="title">
                  Java 21 — Edge
                </div>
                <div class="description">
                  macOS
                </div>
              </a>

            </div>

          </main>

          </body>
          </html>
          EOF


      - name: Create Docker index
        shell: bash
        run: |

          cat > pages/docker/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">

          <head>
            <meta charset="UTF-8">
            <meta name="viewport"
              content="width=device-width, initial-scale=1.0">

            <title>Docker Selenium CI — Allure Reports</title>

            <style>
              body {
                margin: 0;
                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  Roboto,
                  Arial,
                  sans-serif;
                background: #f6f8fa;
                color: #24292f;
              }

              .container {
                max-width: 900px;
                margin: auto;
                padding: 60px 24px;
              }

              .grid {
                display: grid;
                grid-template-columns:
                  repeat(auto-fit, minmax(220px, 1fr));
                gap: 16px;
              }

              a {
                display: block;
                padding: 25px;
                background: white;
                border: 1px solid #d0d7de;
                border-radius: 10px;
                text-decoration: none;
                color: inherit;
              }

              .title {
                font-size: 20px;
                font-weight: 600;
              }

              .back {
                display: inline-block;
                margin-bottom: 30px;
                color: #0969da;
              }
            </style>
          </head>

          <body>

          <main class="container">

            <a class="back" href="../">
              ← Back to Allure Reports
            </a>

            <h1>Docker Selenium CI</h1>

            <div class="grid">

              <a href="./chrome/">
                <div class="title">Chrome</div>
              </a>

              <a href="./firefox/">
                <div class="title">Firefox</div>
              </a>

              <a href="./edge/">
                <div class="title">Edge</div>
              </a>

            </div>

          </main>

          </body>
          </html>
          EOF


      - name: Create main index
        shell: bash
        run: |

          cat > pages/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">

          <head>
            <meta charset="UTF-8">
            <meta name="viewport"
              content="width=device-width, initial-scale=1.0">

            <title>AutoTests — Allure Reports</title>

            <style>
              body {
                margin: 0;
                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  Roboto,
                  Arial,
                  sans-serif;
                background: #f6f8fa;
                color: #24292f;
              }

              .container {
                max-width: 900px;
                margin: auto;
                padding: 70px 24px;
              }

              .reports {
                display: grid;
                grid-template-columns:
                  repeat(auto-fit, minmax(280px, 1fr));
                gap: 24px;
              }

              .report {
                display: block;
                padding: 30px;
                background: white;
                border: 1px solid #d0d7de;
                border-radius: 12px;
                text-decoration: none;
                color: inherit;
              }

              .title {
                font-size: 22px;
                font-weight: 600;
                margin-bottom: 10px;
              }

              .description {
                color: #57606a;
                line-height: 1.5;
              }
            </style>
          </head>

          <body>

          <main class="container">

            <h1>AutoTests</h1>

            <p>
              Allure test reports
            </p>

            <div class="reports">

              <a class="report" href="./selenium/">

                <div class="title">
                  Selenium CI
                </div>

                <div class="description">
                  3 operating systems × 2 Java versions ×
                  3 browsers.
                </div>

              </a>


              <a class="report" href="./docker/">

                <div class="title">
                  Docker Selenium CI
                </div>

                <div class="description">
                  Selenium Docker tests across Chrome,
                  Firefox and Edge.
                </div>

              </a>

            </div>

          </main>

          </body>
          </html>
          EOF


      - name: Show final Pages structure
        run: |
          echo "===== FINAL PAGES STRUCTURE ====="

          find pages -maxdepth 5 -type f | sort | head -300


      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
