name: CI Orchestrator


on:

  push:
    branches:
      - main
      - develop


  schedule:
    - cron: '0 0 * * *'


  workflow_dispatch:

    inputs:

      suite:
        description: Test suite
        required: true
        default: all
        type: choice

        options:
          - all
          - smoke
          - regression


permissions:
  actions: read
  contents: read


jobs:


  selenium:

    name: Selenium / ${{ matrix.os_name }} / Java ${{ matrix.java }} / ${{ matrix.browser }}

    strategy:
      fail-fast: false

      matrix:

        include:

          - os: ubuntu-latest
            os_name: ubuntu
            java: 17
            browser: chrome

          - os: ubuntu-latest
            os_name: ubuntu
            java: 17
            browser: firefox

          - os: ubuntu-latest
            os_name: ubuntu
            java: 17
            browser: edge

          - os: ubuntu-latest
            os_name: ubuntu
            java: 21
            browser: chrome

          - os: ubuntu-latest
            os_name: ubuntu
            java: 21
            browser: firefox

          - os: ubuntu-latest
            os_name: ubuntu
            java: 21
            browser: edge

          - os: windows-latest
            os_name: windows
            java: 17
            browser: chrome

          - os: windows-latest
            os_name: windows
            java: 17
            browser: firefox

          - os: windows-latest
            os_name: windows
            java: 17
            browser: edge

          - os: windows-latest
            os_name: windows
            java: 21
            browser: chrome

          - os: windows-latest
            os_name: windows
            java: 21
            browser: firefox

          - os: windows-latest
            os_name: windows
            java: 21
            browser: edge

          - os: macos-latest
            os_name: macos
            java: 17
            browser: chrome

          - os: macos-latest
            os_name: macos
            java: 17
            browser: firefox

          - os: macos-latest
            os_name: macos
            java: 17
            browser: edge

          - os: macos-latest
            os_name: macos
            java: 21
            browser: chrome

          - os: macos-latest
            os_name: macos
            java: 21
            browser: firefox

          - os: macos-latest
            os_name: macos
            java: 21
            browser: edge


    uses: ./.github/workflows/ci.yml

    secrets: inherit

    with:

      suite: ${{ inputs.suite || 'all' }}

      os: ${{ matrix.os }}

      os_name: ${{ matrix.os_name }}

      java: ${{ matrix.java }}

      browser: ${{ matrix.browser }}

  docker:

    name: Docker Selenium CI

    uses: ./.github/workflows/docker-ci.yml

    secrets: inherit

  publish:

    name: Publish Allure Pages

    needs:
      - selenium
      - docker

    if: always()

    uses: ./.github/workflows/allure-pages.yml

    with:

      selenium_run_id: ${{ github.run_id }}

      docker_run_id: ${{ github.run_id }}

    permissions:

      actions: read
      contents: read
      pages: write
      id-token: write