name: CI Orchestrator

on:

  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        required: true
        default: all
        type: choice

        options:
          - all
          - smoke
          - regression


permissions:
  contents: read
  actions: read
  pages: write
  id-token: write


jobs:

  selenium:

    name: Selenium CI

    uses: ./.github/workflows/ci.yml

    secrets: inherit

    with:
      suite: ${{ inputs.suite || 'all' }}


  docker:

    name: Docker Selenium CI

    uses: ./.github/workflows/docker-ci.yml

    secrets: inherit

    with:
      suite: ${{ inputs.suite || 'all' }}


  publish:

    name: Publish Allure Pages

    needs:
      - selenium
      - docker

    if: always()

    uses: ./.github/workflows/allure-pages.yml

    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write