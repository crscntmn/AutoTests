name: CI Orchestrator

on:

  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:
    inputs:

      suite:
        description: Test suite
        required: true
        default: all
        type: choice

        options:
          - all
          - smoke
          - regression

permissions:
  actions: read
  contents: read

jobs:

  selenium:

    name: Selenium CI

    uses: ./.github/workflows/ci.yml

    secrets: inherit

    with:
      suite: ${{ inputs.suite || 'all' }}


  docker:

    name: Docker Selenium CI

    uses: ./.github/workflows/docker-ci.yml

    secrets: inherit


  ci-passed:

    name: CI Tests Passed

    needs:
      - selenium
      - docker

    if: always()

    runs-on: ubuntu-latest

    steps:

      - name: Check test results
        run: |
          echo "Selenium result: ${{ needs.selenium.result }}"
          echo "Docker result: ${{ needs.docker.result }}"

          if [ "${{ needs.selenium.result }}" != "success" ]; then
            echo "Selenium CI failed."
            exit 1
          fi

          if [ "${{ needs.docker.result }}" != "success" ]; then
            echo "Docker CI failed."
            exit 1
          fi

          echo "All CI tests passed."


  publish:

    name: Publish Allure Pages

    needs:
      - selenium
      - docker

    if: always()

    uses: ./.github/workflows/allure-pages.yml

    with:

      selenium_run_id:
        ${{ needs.selenium.outputs.run_id }}

      docker_run_id:
        ${{ needs.docker.outputs.run_id }}

    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write