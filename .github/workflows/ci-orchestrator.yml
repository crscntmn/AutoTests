name: CI Orchestrator

on:
  push:
    branches:
      - main
      - develop

  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        required: true
        default: all
        type: choice
        options:
          - all
          - smoke
          - regression

permissions:
  actions: read
  contents: read

jobs:
  selenium:
    name: Selenium CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      suite: ${{ inputs.suite || 'all' }}

  docker:
    name: Docker Selenium CI
    uses: ./.github/workflows/docker-ci.yml
    secrets: inherit

  publish:
    name: Publish Allure Pages

    needs:
      - selenium
      - docker

    if: |
      always() &&
      needs.selenium.result != 'cancelled' &&
      needs.docker.result != 'cancelled'

    uses: ./.github/workflows/allure-pages.yml

    with:
      selenium_run_id: ${{ needs.selenium.outputs.run_id }}
      docker_run_id: ${{ needs.docker.outputs.run_id }}

    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write