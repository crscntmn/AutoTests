services:

  selenium:
    image: ${SELENIUM_IMAGE:-selenium/standalone-chrome:latest}

    container_name: selenium

    ports:
      - "4444:4444"

    shm_size: "2gb"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:4444/status || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  autotests:
    build: .

    container_name: autotests

    environment:
      SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub

      BROWSER: ${BROWSER:-chrome}

      PASSWORD: ${PASSWORD}
      SHORT_PASSWORD: ${SHORT_PASSWORD}
      INVALIDATE_PASSWORD: ${INVALIDATE_PASSWORD}
      WRONG_PASSWORD: ${WRONG_PASSWORD}

      TEST_GROUP: ${TEST_GROUP:-}

    depends_on:
      selenium:
        condition: service_healthy

    command: >
      sh -c "mvn clean test ${TEST_GROUP:+-Dgroups=$TEST_GROUP}"